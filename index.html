<!DOCTYPE html>

<html lang="hr">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="dist/output.css">
    <title>Katalog knjiga</title>
    <script type="module" src="js/main.js"></script>
</head>
<body class="bg-amber-100 text-orange-400">
    <main class="mx-auto max-w-5xl p-4">
        <header class="mb-4">
            <h1 class="text-3xl font-bold mb-2 text-orange-700">Katalog knjiga</h1>
            <p id="count"></p>

        <div id="list" class="grid gap-6 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4"></div>
        <p id="empty" class="rounded-lg bg-amber-50 p-4 text-center text-orange-700">Danas nema dostupnih knjiga.</p>
    </main>

</html>
