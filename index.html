<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="dist/output.css">
    <title>Katalog knjiga</title>
</head>
<body class="bg-amber-100 text-amber-900">
    <main class="mx-auto max-w-5xl p-4">
        <header class="mb-4">
            <h1 class="text-2xl font-bold">Katalog knjiga</h1>
            <p id="count" class="text-amber-500"></p>
        </header>
        <p id="loading" class="mb-4">Učitavanje kataloga knjiga</p>
        <div id="list" class="grid gap-4 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4"></div>
        <p id="empty" class="rounded-lg bg-white p-4 text-center">Danas nema dostupnih knjiga.</p>
    </main>
    
</body>
</html>
